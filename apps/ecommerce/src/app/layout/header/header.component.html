<div
  class="flex flex-1 flex-wrap items-center gap-3 gap-y-2 px-4 py-2 w-full min-w-0 justify-between"
>
  <h1 class="text-lg font-semibold m-0 shrink-0">{{ 'header.title' | transloco }}</h1>

  <div class="flex flex-wrap items-center gap-2 md:gap-3 justify-end ms-auto">
    <div
      class="inline-flex overflow-hidden rounded-md border border-border"
      role="group"
      [attr.aria-label]="'uiLanguage.label' | transloco"
    >
      <button
        type="button"
        class="px-2.5 py-1 text-xs font-medium text-foreground hover:bg-surface-hover"
        [class.bg-surface-hover]="uiLanguage.language() === 'el'"
        [class.font-semibold]="uiLanguage.language() === 'el'"
        [attr.aria-pressed]="uiLanguage.language() === 'el'"
        (click)="setLanguage('el')"
      >
        {{ 'uiLanguage.el' | transloco }}
      </button>
      <button
        type="button"
        class="px-2.5 py-1 text-xs font-medium text-foreground hover:bg-surface-hover"
        [class.bg-surface-hover]="uiLanguage.language() === 'en'"
        [class.font-semibold]="uiLanguage.language() === 'en'"
        [attr.aria-pressed]="uiLanguage.language() === 'en'"
        (click)="setLanguage('en')"
      >
        {{ 'uiLanguage.en' | transloco }}
      </button>
    </div>

    <button
      libButton
      type="button"
      variant="ghost"
      size="icon"
      [attr.aria-label]="
        uiTheme.theme() === 'light'
          ? ('header.themeLight' | transloco)
          : ('header.themeDark' | transloco)
      "
      (click)="toggleTheme()"
    >
      <i
        class="pi"
        [class.pi-moon]="uiTheme.theme() === 'light'"
        [class.pi-sun]="uiTheme.theme() !== 'light'"
        aria-hidden="true"
      ></i>
    </button>

    <span class="header__cart-wrapper">
      <button
        libButton
        type="button"
        variant="ghost"
        size="icon"
        [attr.aria-label]="'header.openCart' | transloco"
        (click)="openCartDrawer()"
      >
        <i class="pi pi-shopping-cart" aria-hidden="true"></i>
      </button>
      @if (cartRead.totalUnitCount() > 0) {
        <span
          class="header__cart-badge"
          [attr.aria-label]="
            'header.cartCount' | transloco: { count: cartRead.totalUnitCount() }
          "
        >
          {{ cartRead.totalUnitCount() }}
        </span>
      }
    </span>

    <div *authIf="'connected'; else notConnectedTemplate; pending: loadingTemplate">
      <div class="flex flex-wrap items-center gap-2">
        <a
          routerLink="/orders"
          class="text-sm hover:underline whitespace-nowrap px-1 text-primary dark:text-primary-foreground"
        >
          {{ 'header.orders' | transloco }}
        </a>
        <span
          class="text-sm text-gray-700 dark:text-gray-200 max-w-[14rem] truncate inline-block align-middle"
          [attr.title]="authStore.authUser()?.email ?? ''"
        >
          {{ authStore.authUser()?.name }}
        </span>
        <button
          libButton
          type="button"
          variant="ghost"
          size="sm"
          [attr.aria-label]="'header.logout' | transloco"
          (click)="logout()"
        >
          <i class="pi pi-sign-out" aria-hidden="true"></i>
          {{ 'header.logout' | transloco }}
        </button>
      </div>
    </div>

    <ng-template #loadingTemplate>
      <span class="text-sm text-gray-500 dark:text-gray-400 px-1">{{
        'header.signingIn' | transloco
      }}</span>
    </ng-template>

    <ng-template #notConnectedTemplate>
      <a
        routerLink="/login"
        class="text-sm hover:underline whitespace-nowrap px-1 text-primary dark:text-primary-foreground"
      >
        {{ 'header.signIn' | transloco }}
      </a>
    </ng-template>
  </div>
</div>
