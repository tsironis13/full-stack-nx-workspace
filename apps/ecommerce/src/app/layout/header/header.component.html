<h1>Header</h1>

<p-button
  [icon]="theme() === 'light' ? 'pi pi-moon' : 'pi pi-sun'"
  [aria-label]="theme() === 'light' ? 'Toggle dark mode' : 'Toggle light mode'"
  (onClick)="toggleTheme()"
/>

<span class="header__cart-wrapper">
  <p-button
    icon="pi pi-shopping-cart"
    aria-label="Άνοιγμα καλαθιού"
    (onClick)="openCartDrawer()"
  />
  @if (cartRead.totalUnitCount() > 0) {
    <span class="header__cart-badge" aria-label="{{ cartRead.totalUnitCount() }} αντικείμενα στο καλάθι">
      {{ cartRead.totalUnitCount() }}
    </span>
  }
</span>

<app-cart-drawer [(visible)]="cartDrawerVisible" />

<div *authIf="'connected'; else notConnectedTemplate; pending: loadingTemplate">
  <p>Welcome, user!</p>
</div>

<ng-template #loadingTemplate>
  <p>Loading...</p>
</ng-template>

<ng-template #notConnectedTemplate>
  <p>Please connect to access this content.</p>
  <p-button icon="pi pi-user" aria-label="Login" (onClick)="login()" />
</ng-template>
