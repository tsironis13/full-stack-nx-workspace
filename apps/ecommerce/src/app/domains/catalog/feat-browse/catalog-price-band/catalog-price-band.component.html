<div
  class="catalog-browse__price-band"
  role="group"
  [attr.aria-label]="'catalog.price.aria' | transloco"
>
  <span class="catalog-browse__facet-label">{{
    'catalog.price.label' | transloco
  }}</span>
  <div class="catalog-browse__price-slider-wrap">
    <app-price-range-slider
      class="catalog-browse__price-slider"
      [min]="sliderLow()"
      [max]="sliderHigh()"
      [options]="sliderOptions"
      (userChangeEnd)="onSliderChangeEnd($event)"
    >
      <ng-template priceRangeDisplay let-ctx>
        <app-price-range-display
          [minRange]="ctx.minRange"
          [maxRange]="ctx.maxRange"
          [maxValue]="ctx.maxValue"
        />
      </ng-template>
    </app-price-range-slider>
  </div>
  <div class="catalog-browse__price-actions catalog-browse__price-actions--below-slider">
    <button type="button" class="catalog-browse__btn" (click)="onApply()">
      {{ 'catalog.price.apply' | transloco }}
    </button>
    <button
      type="button"
      class="catalog-browse__btn catalog-browse__btn--secondary"
      (click)="onClear()"
    >
      {{ 'catalog.price.clear' | transloco }}
    </button>
  </div>
  @if (filterError(); as err) {
    <p class="catalog-browse__facet-error" role="alert">{{ err | transloco }}</p>
  }
  <p class="catalog-browse__facet-help">
    {{ 'catalog.price.hint' | transloco }}
  </p>
</div>
