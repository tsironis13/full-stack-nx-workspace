<div class="catalog-browse__attribute-facets">
  @if (hasActiveFilters()) {
    <div class="catalog-browse__facet-actions">
      <button
        type="button"
        libButton
        variant="secondary"
        size="sm"
        (click)="filtersCleared.emit()"
      >
        {{ 'catalog.attributes.clear' | transloco }}
      </button>
    </div>
  }
  @for (facet of facets(); track facet.attributeId) {
    <div
      class="catalog-browse__facet"
      role="group"
      [attr.aria-label]="facet.name ?? ('catalog.attributes.fallback' | transloco)"
    >
      <span class="catalog-browse__facet-label">{{ facet.name ?? '—' }}</span>
      <ul class="catalog-browse__facet-values" role="list">
        @for (val of facet.values; track val.valueId) {
          <li class="catalog-browse__facet-value">
            <label class="catalog-browse__facet-value-label">
              <input
                libCheckbox
                type="checkbox"
                [checked]="isSelected(facet.attributeId, val.valueId)"
                (change)="onCheckboxChange(facet.attributeId, val.valueId, $any($event.target).checked)"
                [attr.aria-label]="(facet.name ?? ('catalog.attributes.fallback' | transloco)) + ': ' + (val.value ?? '—')"
              />
              <span>{{ val.value ?? '—' }}</span>
            </label>
          </li>
        }
      </ul>
    </div>
  }
</div>
