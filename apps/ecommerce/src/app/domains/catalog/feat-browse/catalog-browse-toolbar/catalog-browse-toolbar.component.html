<div class="catalog-browse__toolbar">
  <div class="catalog-browse__field catalog-browse__field--search">
    <label class="catalog-browse__label" for="catalog-search">{{
      'catalog.searchLabel' | transloco
    }}</label>
    <div class="catalog-browse__search-row">
      <div class="catalog-browse__search-input">
        <input
          libInput
          id="catalog-search"
          type="search"
          [ngModel]="searchDraft()"
          (ngModelChange)="searchDraft.set($event)"
          (keydown.enter)="onApply()"
          [placeholder]="'catalog.searchPlaceholder' | transloco"
        />
      </div>
      <button type="button" libButton (click)="onApply()">
        {{ 'catalog.apply' | transloco }}
      </button>
    </div>
  </div>
  <div class="catalog-browse__field">
    <label class="catalog-browse__label" for="catalog-sort">{{
      'catalog.sortLabel' | transloco
    }}</label>
    <select
      libSelect
      id="catalog-sort"
      [ngModel]="sort()"
      (ngModelChange)="sortChanged.emit($event)"
    >
      @for (opt of sortOptions(); track opt.value) {
        <option [ngValue]="opt.value">{{ opt.labelKey | transloco }}</option>
      }
    </select>
  </div>
</div>
