<div
  class="catalog-browse__facet"
  role="group"
  [attr.aria-label]="'catalog.rating.aria' | transloco"
>
  <span class="catalog-browse__facet-label">{{
    'catalog.rating.label' | transloco
  }}</span>
  <div class="catalog-browse__facet-chips">
    <button
      type="button"
      class="catalog-browse__chip"
      [class.catalog-browse__chip--active]="selectedMinRating() === null"
      (click)="minRatingSelected.emit(null)"
    >
      {{ 'catalog.rating.all' | transloco }}
    </button>
    @for (stars of options; track stars) {
      <button
        type="button"
        class="catalog-browse__chip"
        [class.catalog-browse__chip--active]="selectedMinRating() === stars"
        (click)="minRatingSelected.emit(stars)"
      >
        {{ 'catalog.rating.andUp' | transloco: { stars } }}
      </button>
    }
  </div>
  <p class="catalog-browse__facet-help">
    {{ 'catalog.rating.hint' | transloco }}
  </p>
</div>
