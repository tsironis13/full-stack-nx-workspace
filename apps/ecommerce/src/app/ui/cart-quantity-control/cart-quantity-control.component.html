@if (quantity() > 0) {
  <div class="flex items-center justify-center gap-2">
    <button
      libButton
      type="button"
      variant="ghost"
      size="icon"
      [attr.aria-label]="'cart.decreaseQty' | transloco"
      (click)="removeItemFromCart.emit()"
    >
      <i class="pi pi-minus" aria-hidden="true"></i>
    </button>
    <div>{{ quantity() }}</div>
    <button
      libButton
      type="button"
      variant="ghost"
      size="icon"
      [attr.aria-label]="'cart.increaseQty' | transloco"
      (click)="addItemToCart.emit()"
    >
      <i class="pi pi-plus" aria-hidden="true"></i>
    </button>
  </div>
} @else {
  <button
    libButton
    type="button"
    variant="ghost"
    size="icon"
    [attr.aria-label]="'cart.increaseQty' | transloco"
    (click)="addItemToCart.emit()"
  >
    <i class="pi pi-shopping-cart" aria-hidden="true"></i>
  </button>
}
