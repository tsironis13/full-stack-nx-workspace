<div class="cart-unavailable-line-alert__panel" role="alert">
  <span class="pi pi-exclamation-triangle" aria-hidden="true"></span>
  <span>{{ 'cart.unavailable' | transloco }}</span>
  <button
    libButton
    type="button"
    variant="danger"
    size="icon"
    [attr.aria-label]="'cart.removeUnavailable' | transloco"
    (click)="remove.emit()"
  >
    <i class="pi pi-trash" aria-hidden="true"></i>
  </button>
</div>
